[project]
name = "fastapi-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ar2407-prog", email = "ar2407@srmist.edu.in" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "google-genai>=2.20.0",
    "google-generativeai>=0.8.6",
    "groq>=1.7.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "markdown>=3.10.3",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "supabase>=2.31.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
fastapi-app = "fastapi_app:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
