<header
  class="h-16 bg-white/80 backdrop-blur-md border-b border-emerald-900/10 px-6 flex items-center justify-between sticky top-0 z-10 shadow-xs"
>
  <div class="min-w-0">
    <h2 class="font-bold text-stone-800 text-sm md:text-base tracking-tight truncate">
      {{ page_title or "Overview" }}
    </h2>
    <p class="text-[11px] text-slate-400 truncate hidden sm:block">{{ page_description or "" }}</p>
  </div>

  {% if user %}
    <div class="flex items-center gap-2 pl-3 border-l border-emerald-900/10 shrink-0">
      <div
        class="w-8 h-8 rounded-xl bg-emerald-50 border border-emerald-200/80 flex items-center justify-center text-xs font-bold text-emerald-800"
      >
        {{ user.email[:2] | upper }}
      </div>
      <div class="hidden md:block leading-tight">
        <p class="text-xs font-semibold text-slate-800 truncate max-w-[160px]">{{ user.email }}</p>
        <a href="/logout" class="text-[11px] text-slate-400 hover:text-red-600 font-medium transition-colors">
          Logout
        </a>
      </div>
    </div>
  {% endif %}
</header>
