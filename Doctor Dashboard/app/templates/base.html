<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}AAyushFHIR{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="bg-[#f6f9f6] text-slate-800 min-h-screen flex font-sans antialiased">
    {% include "partials/sidebar.html" %}

    <div class="flex-1 flex flex-col md:pl-72 min-w-0 overflow-y-auto">
      {% include "partials/topbar.html" %}

      <main class="p-6 md:p-8 space-y-6 flex-1">
        {% block content %}{% endblock %}
      </main>
    </div>

    {% block scripts %}{% endblock %}
    <script>
      if (window.lucide) lucide.createIcons();
    </script>
  </body>
</html>
