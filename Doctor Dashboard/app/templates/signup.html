<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - AAyushFHIR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="bg-[#f6f9f6] text-slate-800 min-h-screen flex items-center justify-center font-sans antialiased p-4">
    <div class="w-full max-w-sm">
      
      <div class="flex flex-col items-center mb-6">
        <div class="w-11 h-11 rounded-2xl bg-emerald-700 flex items-center justify-center text-white shadow-sm mb-3">
          <i data-lucide="leaf" class="w-5 h-5"></i>
        </div>
        <h1 class="text-lg font-bold text-slate-900 tracking-tight">AAyushFHIR</h1>
        <p class="text-xs text-slate-500">Clinical Terminology & ABHA Patient Portal</p>
      </div>

      <div class="bg-white rounded-2xl border border-emerald-900/10 shadow-sm p-6 space-y-5">
        <div>
          <h2 class="font-semibold text-slate-900 text-base">Create your account</h2>
          <p class="text-xs text-slate-500 mt-0.5">Select your role and set up your portal access.</p>
        </div>

        {% if error %}
          <div class="text-xs text-red-700 bg-red-50 border border-red-200 rounded-xl px-3 py-2">
            {{ error }}
          </div>
        {% endif %}
        {% if success %}
          <div class="text-xs text-emerald-800 bg-emerald-50 border border-emerald-200 rounded-xl px-3 py-2">
            {{ success }}
          </div>
        {% endif %}

        <form method="post" action="/signup" class="space-y-4">
          
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1.5">Register as</label>
            <div class="grid grid-cols-2 gap-2">
              <label class="cursor-pointer relative block">
                <input type="radio" name="role" value="patient" class="peer sr-only" checked />
                <div class="p-2.5 border border-slate-200 rounded-xl text-center hover:bg-slate-50 peer-checked:border-emerald-600 peer-checked:bg-emerald-50 peer-checked:text-emerald-700 transition-all">
                  <i data-lucide="user" class="w-4 h-4 mx-auto mb-1 text-slate-500 peer-checked:text-emerald-600"></i>
                  <span class="block text-xs font-semibold">Patient</span>
                </div>
              </label>

              <label class="cursor-pointer relative block">
                <input type="radio" name="role" value="doctor" class="peer sr-only" />
                <div class="p-2.5 border border-slate-200 rounded-xl text-center hover:bg-slate-50 peer-checked:border-emerald-600 peer-checked:bg-emerald-50 peer-checked:text-emerald-700 transition-all">
                  <i data-lucide="stethoscope" class="w-4 h-4 mx-auto mb-1 text-slate-500 peer-checked:text-emerald-600"></i>
                  <span class="block text-xs font-semibold">Doctor</span>
                </div>
              </label>
            </div>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Full Name</label>
            <input
              type="text"
              name="full_name"
              required
              placeholder="e.g. Aarav Sharma"
              class="w-full bg-[#f6f9f6] border border-emerald-900/10 rounded-xl px-3 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition"
            />
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Email</label>
            <input
              type="email"
              name="email"
              required
              placeholder="patient@example.com"
              class="w-full bg-[#f6f9f6] border border-emerald-900/10 rounded-xl px-3 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition"
            />
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Password</label>
            <input
              type="password"
              name="password"
              required
              minlength="6"
              placeholder="At least 6 characters"
              class="w-full bg-[#f6f9f6] border border-emerald-900/10 rounded-xl px-3 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition"
            />
          </div>

          <button
            type="submit"
            class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-medium py-2.5 px-4 rounded-xl transition flex items-center justify-center gap-2 shadow-xs text-sm"
          >
            <i data-lucide="user-plus" class="w-4 h-4"></i>
            <span>Create Account</span>
          </button>
        </form>

        <p class="text-xs text-center text-slate-500">
          Already have an account?
          <a href="/login" class="text-emerald-700 font-medium hover:underline">Sign in</a>
        </p>
      </div>
    </div>

    <script>
      if (window.lucide) lucide.createIcons();
    </script>
  </body>
</html>
