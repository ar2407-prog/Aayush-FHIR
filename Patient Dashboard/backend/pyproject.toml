[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "KodeSovereign", email = "KodeSovereign@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "google-genai>=1.0",
    "openai>=3.29.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "supabase>=2.9",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
